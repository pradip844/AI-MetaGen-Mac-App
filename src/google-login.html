<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Google Authentication - AI MetaGen Pro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .box {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
            border: 1px solid #334155;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #3b82f6;
            border-top: 4px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { color: #f97316; margin-top: 0; }
        p { color: #94a3b8; font-size: 14px; }
    </style>
    <!-- Firebase SDK & Config -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://raw.githack.com/metagenp-ctrl/lang-engine/main/core-init.js"></script>
</head>
<body>
    <div class="box">
        <div class="spinner" id="loader"></div>
        <h2 id="statusTitle">Connecting with Google...</h2>
        <p id="statusMsg">Google pop-up is opening; please select your account.</p>
    </div>

    <script>
        function runLogin() {
            if (!window.firebase || !firebase.apps || !firebase.apps.length) {
                setTimeout(runLogin, 200);
                return;
            }

            const provider = new firebase.auth.GoogleAuthProvider();
            provider.addScope('email');
            provider.addScope('profile');

            firebase.auth().signInWithPopup(provider).then((result) => {
                const credential = result.credential;
                document.getElementById('loader').style.display = 'none';
                document.getElementById('statusTitle').innerHTML = '✅ Login successful';
                document.getElementById('statusTitle').style.color = '#10B981';
                document.getElementById('statusMsg').innerHTML = 'You have successfully logged in to your Windows app. You can close this tab.';

                fetch('/auth-callback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        idToken: credential ? credential.idToken : '',
                        accessToken: credential ? credential.accessToken : ''
                    })
                });
            }).catch((err) => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('statusTitle').innerHTML = '❌ Login cancelled';
                document.getElementById('statusTitle').style.color = '#EF4444';
                document.getElementById('statusMsg').innerText = err.message;
            });
        }

        window.addEventListener('load', runLogin);
    </script>
</body>
</html>
